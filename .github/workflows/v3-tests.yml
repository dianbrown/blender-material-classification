name: V3 validation

on:
  pull_request:
  push:
    branches: [main, v3/material-classification]

permissions:
  contents: read

concurrency:
  group: v3-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-v3-lock.txt
      - name: Install CPU test environment
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -c "from pathlib import Path; rows=Path('requirements-v3-lock.txt').read_text(encoding='utf-8-sig').splitlines(); Path('/tmp/v3-ci.txt').write_text('\n'.join(r for r in rows if not r.startswith(('torch==','torchvision=='))) + '\n')"
          python -m pip install -r /tmp/v3-ci.txt
      - name: Lint V3 code
        run: python -m ruff check src/material_classifier/v3 scripts/v3 tests/test_v3*.py
      - name: Test without private images or downloaded weights
        # These two V1 integration checks require the local raw image corpus.
        # They are run in the local full-dataset validation, not silently skipped.
        run: python -m pytest -q -k 'not test_dataset_length_and_metadata and not test_full_dataset_verification_passes'
