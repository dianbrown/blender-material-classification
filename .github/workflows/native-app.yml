name: Native desktop validation

on:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/demo/build_app.ps1'
      - '.github/workflows/native-app.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/demo/build_app.ps1'
      - '.github/workflows/native-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Check Rust formatting
        working-directory: app
        run: cargo +1.99.0 fmt --all -- --check
      - name: Run native unit tests
        working-directory: app
        run: cargo +1.99.0 test --locked --release -j4
      - name: Build release executable
        working-directory: app
        run: cargo +1.99.0 build --locked --release -j4
