[package]
name = "material-studio"
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "aed37547d8543000494fb69101c05daec5891068", default-features = false, features = ["windows-manifest"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "aed37547d8543000494fb69101c05daec5891068" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
debug = 0
strip = "debuginfo"
codegen-units = 16
